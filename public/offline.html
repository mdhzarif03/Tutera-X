<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · Tutera-X</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f3ff; color: #0f172a; }
    .card { max-width: 360px; text-align: center; background: #fff; border-radius: 20px; padding: 32px 24px;
      box-shadow: 0 20px 45px -20px rgba(79, 70, 229, .35); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #475569; line-height: 1.5; margin: 0 0 20px; }
    button { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #a855f7); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Tutera-X needs a connection to load your latest batches, attendance and messages. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
